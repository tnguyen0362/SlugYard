## Copy to local.properties (gitignored) and fill in values you need.
## Empty optional keys disable the related integration at build time.

sdk.dir=/path/to/android/sdk
# ndk.dir=/path/to/android/ndk

# Optional release signing (required for in-place updates over a release APK)
# SLUGYARD_RELEASE_STORE_FILE=sluggyard.jks
# SLUGYARD_RELEASE_KEY_ALIAS=sluggyard
# SLUGYARD_RELEASE_KEY_PASSWORD=
# SLUGYARD_RELEASE_STORE_PASSWORD=

# Optional account sync (Supabase)
SLUGYARD_SUPABASE_URL=
SLUGYARD_SUPABASE_ANON_KEY=
SLUGYARD_SUPABASE_FALLBACK_URL=
AVATAR_PUBLIC_BASE_URL=

# Optional metadata / scrobble integrations
TMDB_API_KEY=
TRAKT_CLIENT_ID=
TRAKT_CLIENT_SECRET=
TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob
OPENSUBTITLES_API_KEY=
MDBLIST_API_KEY=

# Optional stream hosts (blank = skip)
AIOSTREAMS_BASE_URL=
AIOSTREAMS_CONFIG_ACCESS_KEY=
MEDIAFUSION_ENCRYPT_BASE_URL=

# Optional debrid OAuth (Premiumize)
PREMIUMIZE_CLIENT_ID=

# Optional reporting / donations (leave blank to disable)
UNIQUE_CONTRIBUTIONS_BASE_URL=
PLAYBACK_REPORTS_BASE_URL=
DONATIONS_BASE_URL=
DONATIONS_DONATE_URL=
SPONSOR_NAMES=

# Optional: build the local ffmpeg-decoder-downmix module
USE_LOCAL_FFMPEG_DECODER=false
FFMPEG_SOURCE_DIR=
FFMPEG_BUILD_DIR=

# --- DV7 / libdovi (Dolby Vision Profile 7 → 8.1) ---
DOVI_NATIVE_ENABLED=false
DOVI_EXTRACTOR_HOOK_READY=false
DOVI_ENABLE_REAL_LINK=false
DOVI_LIBDOVI_PREBUILT_ROOT=DV7/libdovi
